# =============================================================================
# ci.yml — tests, lint, types, and security scans for google-maps-harness, on
# every push to main and every pull request.
#
# Rules this pipeline encodes (see standards/continuous-integration.md):
# least-privilege token, actions pinned by commit SHA, pinned tool versions,
# tests + lint + types + SAST + secret scan on every push, dependency audit
# against the lockfile.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# SECURITY: least-privilege token — read-only for every job.
permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest version the project supports, plus current stable. Both are run
        # because this project's floor depends on two 3.11 behaviours:
        # datetime.fromisoformat accepting a trailing Z, and datetime.UTC.
        python-version: ["3.11", "3.14"]
    steps:
      # SECURITY: actions pinned to full commit SHAs (tag in comment); the
      # biweekly refresh is the only place these pins get bumped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # SECURITY: --require-hashes installs exactly the versions in the lockfile
      # and verifies each artifact's digest, so a compromised release of any
      # transitive dependency cannot enter CI. --no-deps on the local install
      # keeps pip from resolving anything outside the lockfile.
      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Install the package
        run: pip install -e . --no-deps
      # NOTE: no credentials are set. Every test in this suite runs without
      # network access and without a Google Maps key, which is what makes this
      # job meaningful on a fork and on a fresh clone.
      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v

  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff==0.16.2
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Install the package
        run: pip install -e . --no-deps
      - name: Install mypy
        run: pip install mypy==1.19.1
      # Strict on source; tests are exempt from strict annotation. The package
      # is installed first so mypy resolves the mcp SDK's own types.
      - name: Type check
        run: mypy --strict --exclude tests .

  security:
    name: Security scan (bandit + gitleaks + pip-audit)
    runs-on: ubuntu-latest
    # SECURITY: job-level exception to the workflow's contents-read default —
    # gitleaks lists a PR's commits on pull_request events. Read only.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SECURITY: full history so gitleaks catches deleted-but-published
          # secrets, not just the current tree.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install scanners
        run: pip install bandit==1.9.4 pip-audit==2.9.0
      - name: Static security analysis
        run: bandit -r . -q -x ./tests
      # SECURITY: the audit reads the lockfile rather than an installed
      # environment, so nothing under review executes before it is scanned.
      # Auditing after an install would run each package's import-time code
      # first, which is exactly the supply-chain step being guarded against.
      # NOTE: pip-audit is named explicitly because it recognises a
      # requirements file by content; a scanner that keys on the filename sees
      # nothing in a file called requirements.lock and reports a clean run over
      # zero packages (ledger LL-34).
      - name: Dependency audit
        run: pip-audit -r requirements.lock --strict
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: a failed job is the signal; comments would need write access.
          GITLEAKS_ENABLE_COMMENTS: "false"
